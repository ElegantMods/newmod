name: Download Web Video to Telegram

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Video URL"
        required: true
        type: string
      qualities:
        description: "Qualities, comma-separated (e.g. 480,1080 or 360,480,720,1080,2160)"
        required: true
        type: string
        default: "1080"
      telegram_premium:
        description: "Do you have Telegram Premium?"
        required: true
        type: choice
        default: "no"
        options:
          - "no"
          - "yes"

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 350  # GitHub Actions max for free/standard runners; adjust if needed
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          pip install --upgrade telethon
          pip install --upgrade --pre "yt-dlp[default]"

      - name: Install Deno (JS runtime for yt-dlp)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Write cookies file
        env:
          WEB_COOKIES: ${{ secrets.WEB_COOKIES }}
        run: |
          printf '%s\n' "$WEB_COOKIES" > cookies_raw.txt
          # Strip a UTF-8 BOM if present, normalize CRLF to LF, drop leading blank lines
          sed -i '1s/^\xEF\xBB\xBF//' cookies_raw.txt
          sed -i 's/\r$//' cookies_raw.txt
          sed -i '/./,$!d' cookies_raw.txt
          # Ensure the file starts with the required Netscape cookies header
          if ! head -n 1 cookies_raw.txt | grep -q '^# \(Netscape\|HTTP Cookie File\)'; then
            { echo "# Netscape HTTP Cookie File"; cat cookies_raw.txt; } > cookies.txt
          else
            mv cookies_raw.txt cookies.txt
          fi
          rm -f cookies_raw.txt

      - name: Diagnose cookies file (no secret content printed)
        run: |
          echo "File size (bytes): $(wc -c < cookies.txt)"
          echo "Line count: $(wc -l < cookies.txt)"
          echo "First line (structure only, values masked):"
          head -n 1 cookies.txt | sed -E 's/[A-Za-z0-9_%.-]{6,}/***/g'
          echo "Detected line endings:"
          file cookies.txt
          echo "Has CRLF (Windows) line endings: $(grep -c $'\r' cookies.txt || true)"
          echo "Starts with UTF-8 BOM: $(head -c3 cookies.txt | xxd -p)"

      - name: Verify secrets are set (does not print values)
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
        run: |
          [ -z "$TELEGRAM_API_ID" ] && echo "TELEGRAM_API_ID is EMPTY" || echo "TELEGRAM_API_ID is set (length: ${#TELEGRAM_API_ID})"
          [ -z "$TELEGRAM_API_HASH" ] && echo "TELEGRAM_API_HASH is EMPTY" || echo "TELEGRAM_API_HASH is set (length: ${#TELEGRAM_API_HASH})"
          [ -z "$TELEGRAM_SESSION" ] && echo "TELEGRAM_SESSION is EMPTY" || echo "TELEGRAM_SESSION is set (length: ${#TELEGRAM_SESSION})"

      - name: Run uploader
        env:
          VIDEO_URL: ${{ inputs.video_url }}
          QUALITIES: ${{ inputs.qualities }}
          MAX_SIZE_GB: ${{ inputs.telegram_premium == 'yes' && '3.9' || '1.9' }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          WEB_COOKIES_FILE: cookies.txt
        run: python upload_to_telegram.py

      - name: Clean up cookies file
        if: always()
        run: rm -f cookies.txt
