name: Upload video to Telegram

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "YouTube video URL"
        required: true
        type: string
      qualities:
        description: "Qualities, comma-separated (e.g. 480,1080 or 360,480,720,1080)"
        required: true
        type: string
        default: "1080"

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 350  # GitHub Actions max for free/standard runners; adjust if needed
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          pip install --upgrade telethon
          pip install --upgrade --pre "yt-dlp[default]"

      - name: Install Deno (JS runtime for yt-dlp)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Write YouTube cookies file
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: printf '%s\n' "$YT_COOKIES" > cookies.txt

      - name: Diagnose cookies file (no secret content printed)
        run: |
          echo "File size (bytes): $(wc -c < cookies.txt)"
          echo "Line count: $(wc -l < cookies.txt)"
          echo "First line starts with '# ': $(head -c 2 cookies.txt | grep -c '^# ' || true)"

      - name: Verify secrets are set (does not print values)
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
        run: |
          [ -z "$TELEGRAM_API_ID" ] && echo "TELEGRAM_API_ID is EMPTY" || echo "TELEGRAM_API_ID is set (length: ${#TELEGRAM_API_ID})"
          [ -z "$TELEGRAM_API_HASH" ] && echo "TELEGRAM_API_HASH is EMPTY" || echo "TELEGRAM_API_HASH is set (length: ${#TELEGRAM_API_HASH})"
          [ -z "$TELEGRAM_SESSION" ] && echo "TELEGRAM_SESSION is EMPTY" || echo "TELEGRAM_SESSION is set (length: ${#TELEGRAM_SESSION})"

      - name: Run uploader
        env:
          VIDEO_URL: ${{ inputs.video_url }}
          QUALITIES: ${{ inputs.qualities }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          YT_COOKIES_FILE: cookies.txt
        run: python upload_to_telegram.py

      - name: Clean up cookies file
        if: always()
        run: rm -f cookies.txt
